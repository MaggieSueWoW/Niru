[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "niru"
version = "0.1.0"
description = "Niru is a Mythic+ roster bot that syncs Raider.IO data into MongoDB and Google Sheets."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "certifi==2026.7.22",
  "google-api-python-client==2.198.0",
  "google-auth==2.56.3",
  "google-auth-httplib2==0.4.1",
  "httplib2==0.32.0",
  "PyYAML==6.0.3",
  "pymongo==4.17.0",
  "python-dotenv==1.2.3",
  "redis==8.1.0",
]

[project.optional-dependencies]
dev = [
  "black>=25.1.0",
  "isort>=6.0.1",
  "mypy>=1.15.0",
  "pytest>=8.3.5",
]

[project.scripts]
niru = "niru.app:main"
niru-seed-play-profile = "niru.play_profile_seed:main"

[tool.setuptools.packages.find]
include = ["niru*"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
